<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterBase Query Manager — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-container {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; flex-direction: column;
        }
        .login-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 40px; width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,.3);
        }
        .login-box h1 { text-align: center; margin-bottom: 8px; font-size: 22px; color: var(--primary); }
        .login-box p { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 13px; }
        .login-form input {
            width: 100%; background: var(--bg-elev); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 16px; color: var(--text); font-size: 14px;
            margin-bottom: 12px; box-sizing: border-box;
        }
        .login-form input:focus { outline: none; border-color: var(--primary); }
        .login-form button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: background .15s;
        }
        .login-form button:hover { background: var(--primary-hover); }
        .login-error { color: var(--error); text-align: center; margin-bottom: 16px; font-size: 13px; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h1>InterBase Query Manager</h1>
        <p>Sign in with your HD_ account</p>
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
        <form class="login-form" method="POST" action="/login">
            <input type="text" name="username" placeholder="hd_username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</div>
</body>
</html>
